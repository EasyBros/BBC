<!doctype html><html lang="ko" class="theme-dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBC - 멤버</title>
<script>document.documentElement.classList.add(localStorage.getItem('theme')==='light'?'theme-light':'theme-dark');</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="assets/css/app.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script></head>
<body data-page="members" data-page-title="멤버"><main id="app-content"><div class="page-heading"><div><h1>멤버 관리</h1><p>클럽 멤버와 리그 정보를 관리합니다.</p></div><button class="btn btn-primary" id="add-member">멤버 추가</button></div><section class="card"><div class="member-toolbar card-body"><strong id="member-count">멤버 0명</strong><input class="form-control" id="member-search" placeholder="이름 검색..." style="max-width:260px"></div><div class="table-wrap"><table class="table member-table"><thead><tr><th>이름</th><th>닉네임</th><th>급수</th><th>가입일</th><th>작업</th></tr></thead><tbody id="member-rows"><tr><td colspan="5" class="empty-state">로그인 후 데이터를 불러옵니다.</td></tr></tbody></table></div></section></main>
<div class="modal fade" id="member-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="member-form"><div class="modal-header"><h2 class="modal-title fs-5" id="member-modal-title">멤버 추가</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button></div><div class="modal-body"><input type="hidden" name="id"><label class="form-label" for="member-name">이름 *</label><input class="form-control" id="member-name" name="name" required maxlength="50" placeholder="홍길동"><label class="form-label mt-3" for="member-nickname">닉네임 (선택)</label><input class="form-control" id="member-nickname" name="nickname" maxlength="50" placeholder="길동이"><label class="form-label mt-3" for="member-grade">급수</label><select class="form-select" id="member-grade" name="grade"><option value="S조">👑 S조 · 최상급</option><option value="A조">💎 A조</option><option value="B조">🥇 B조</option><option value="C조">🥈 C조</option><option value="D조">🥉 D조</option><option value="초심">🌱 초심</option></select><label class="form-label mt-3" for="member-joined">가입일</label><input class="form-control" id="member-joined" name="joined_at" type="date"><div id="member-admin-option" class="form-check mt-3" hidden><input class="form-check-input" type="checkbox" id="member-is-admin" name="is_admin"><label class="form-check-label" for="member-is-admin">👑 관리자</label></div><div id="member-guest-option" class="form-check mt-2"><input class="form-check-input" type="checkbox" id="member-is-guest" name="is_guest"><label class="form-check-label" for="member-is-guest">게스트</label></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button><button type="submit" class="btn btn-primary" id="member-submit">추가</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module">import{initLayout}from'./assets/js/layout.js';await initLayout();if(window.BBC_CONFIG_READY)await import('./assets/js/pages/members.js');</script></body></html>

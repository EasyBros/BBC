<!doctype html>
<html lang="ko" class="theme-dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BBC - 대시보드</title>
  <script>document.documentElement.classList.add(localStorage.getItem('theme')==='light'?'theme-light':'theme-dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body data-page="dashboard" data-page-title="대시보드">
  <main id="app-content">
    <nav class="dashboard-social-links" aria-label="배드민턴 유튜브 채널">
      <a href="https://www.youtube.com/@%EC%98%81%EB%AF%BC%ED%84%B4-d7t" target="_blank" rel="noopener noreferrer"><i class="bi bi-youtube" aria-hidden="true"></i> 영민턴</a>
      <a href="https://www.youtube.com/@samsaclub" target="_blank" rel="noopener noreferrer"><i class="bi bi-youtube" aria-hidden="true"></i> 삼사클럽</a>
    </nav>
    <section class="dashboard-banner card" id="season-banner"><div><span class="season-icon">🏸</span><div><strong>BBC 리그</strong><p>출석과 경기를 기록하고 시즌 흐름을 확인하세요.</p></div></div><p class="season-teaser">불광 배드민턴 클럽</p></section>
    <section class="summary-grid" id="summary-cards" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <section class="section-block"><div class="section-title-row"><div><h2>Today's Highlight</h2><p>오늘의 경기 기록에서 뽑은 하이라이트</p></div><button class="btn btn-outline-secondary" id="copy-highlights">📋 복사</button></div><div class="highlight-grid" id="today-highlights"><div class="card empty-state">로그인 후 데이터를 불러옵니다.</div></div></section>
    <section class="dashboard-grid" id="ranking-cards"></section>
  </main>
  <script type="module">
    import { initLayout } from './assets/js/layout.js';
    await initLayout();
    await import('./assets/js/pages/dashboard.js');
  </script>
</body>
</html>
